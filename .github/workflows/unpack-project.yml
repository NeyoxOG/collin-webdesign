name: Unpack project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message || '', '[unpack]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cloudflare project
        run: |
          rm -rf .unpack
          mkdir .unpack
          unzip -q collin-webdesign-cloudflare.zip -d .unpack
          cp -a .unpack/collin-webdesign-cloudflare/. .
          rm -rf .unpack
          git status --short

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "[unpack] Add Cloudflare Pages project files"
          git push
